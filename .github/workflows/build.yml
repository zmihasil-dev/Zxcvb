name: build-mtp
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q -o ./*.zip -d proj
      - run: cd proj && chmod +x build.sh && ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mtp
          path: proj/*.mtp
